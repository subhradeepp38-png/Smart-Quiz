<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Admin — Smart Quiz{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark glass-nav sticky-top">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold" href="{{ url_for('admin_dashboard') }}">
      <i class="bi bi-shield-lock-fill text-warning"></i> Admin Panel
    </a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#adminnav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="adminnav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('admin_dashboard') }}"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('admin_questions') }}"><i class="bi bi-question-square"></i> Questions</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('admin_categories') }}"><i class="bi bi-tags"></i> Categories</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('admin_users') }}"><i class="bi bi-people"></i> Users</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('admin_results') }}"><i class="bi bi-bar-chart"></i> Results</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}"><i class="bi bi-globe"></i> Site</a></li>
        <li class="nav-item"><a class="btn btn-sm btn-outline-light ms-2" href="{{ url_for('admin_logout') }}">Logout</a></li>
      </ul>
    </div>
  </div>
</nav>
<main class="container-fluid px-4 py-4">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} alert-dismissible fade show">
        {{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
